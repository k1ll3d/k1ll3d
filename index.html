<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website của tôi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      max-width: 450px;
      margin: 40px auto;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 25px #0002;
    }
    h1 { color: #6254c7; }
    button {
      background: #6254c7;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Xin chào! 👋</h1>
    <p>Chào mừng bạn đến với website của tôi.</p>
    <button onclick="alert('Website hoạt động rồi! 🎉')">
      Bấm thử nhé!
    </button>
  </div>
</body>
</html>
